; PlatformIO Configuration for FeedMe
; Target: Seeed XIAO ESP32-C6 + 2.9" E-Paper
; Using pioarduino platform for Arduino 3.x support (ESP32-C6 compatible)
; Reference: https://github.com/sigmdel/xiao_esp32c6_sketches

[env:seeed_xiao_esp32c6]
platform = http://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

; Serial monitor
monitor_speed = 115200

; Partition scheme - dual OTA slots (1.875 MB each) + 128 KB LittleFS
; huge_app.csv has a single app slot and cannot support OTA
board_build.partitions = partitions_ota.csv
board_build.filesystem = littlefs

; Library dependencies
; Using mathieucarbou forks for Arduino 3.x compatibility
lib_deps =
    zinggjm/GxEPD2@^1.5.8
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    https://github.com/mathieucarbou/AsyncTCP.git
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/qrcode@^0.0.1
    adafruit/RTClib@^2.1.4

; Build flags
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; Automatic light sleep inside BLE windows. The prebuilt Arduino libs for the
; C6 ship without power management, which made LightSleepManager a silent
; no-op (~0.4 W with BLE on). This rebuilds the libs with it enabled; the first
; build downloads ESP-IDF and is slow. BLE keeps its main-XTAL sleep clock
; (the Xiao C6 has no 32 kHz crystal).
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_BT_LE_SLEEP_ENABLE=y
    CONFIG_ESP_PHY_MAC_BB_PD=y
    CONFIG_MAC_BB_PD=y
    ; CONFIG_PM_SLP_DISABLE_GPIO stays on (=n here is ignored by the build);
    ; light_sleep_manager.cpp opts the output pins out with gpio_sleep_sel_dis.
    ; Diagnostic: time-in-mode and lock-holder stats for esp_pm_dump_locks()
    CONFIG_PM_PROFILING=y
; Unused Espressif cloud components; esp_insights fails to build in the
; rebuilt-libs mode (missing generated https_server.crt.S)
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/esp_rainmaker
    espressif/rmaker_common

