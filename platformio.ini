; PlatformIO Configuration for FeedMe
; Target: LILYGO T-Display-S3

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino

; Serial monitor
monitor_speed = 115200

; Partition scheme with space for LittleFS
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; Library dependencies
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    me-no-dev/ESPAsyncWebServer@^1.2.4
    me-no-dev/AsyncTCP@^1.1.1
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/qrcode@^0.0.1

; Build flags for T-Display-S3 (8-bit parallel interface)
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    ; 8-bit parallel interface pins
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    ; Backlight
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    ; Fonts
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DARDUINO_USB_CDC_ON_BOOT=1
